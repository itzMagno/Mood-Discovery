<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>What's the vibe?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0D0D12;
    --surface: #17171F;
    --surface-raised: #1F1F29;
    --text: #F5F3EE;
    --text-muted: #8A8A96;
    --happy: #F2B441;
    --happy-dim: #4A3C1F;
    --chill: #4FA8B8;
    --chill-dim: #1E3438;
    --accent: var(--happy);
    --accent-dim: var(--happy-dim);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--ink);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    overflow-x: hidden;
  }

  .screen {
    flex: 1;
    display: none;
    flex-direction: column;
    justify-content: center;
    padding: 32px 24px 48px;
    max-width: 480px;
    margin: 0 auto;
    width: 100%;
  }

  .screen.active {
    display: flex;
    animation: rise 0.5s ease both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .kicker {
    font-size: 15px;
    color: var(--text-muted);
    margin: 0 0 8px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: clamp(30px, 8vw, 40px);
    line-height: 1.15;
    margin: 0 0 36px;
    letter-spacing: -0.01em;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .grid.single {
    grid-template-columns: 1fr;
  }

  button.option {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 17px;
    font-weight: 500;
    color: var(--text);
    background: var(--surface);
    border: 1px solid #29293580;
    border-radius: 14px;
    padding: 22px 16px;
    text-align: left;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }

  button.option:active {
    transform: scale(0.97);
  }

  button.option .emoji {
    display: block;
    font-size: 26px;
    margin-bottom: 10px;
  }

  button.option.happy-tint:hover,
  button.option.happy-tint:active { border-color: var(--happy); background: var(--happy-dim); }

  button.option.chill-tint:hover,
  button.option.chill-tint:active { border-color: var(--chill); background: var(--chill-dim); }

  button.option.sad-tint:hover,
  button.option.sad-tint:active { border-color: #6E8CB0; background: #24303D; }

  button.option.hype-tint:hover,
  button.option.hype-tint:active { border-color: #E85D4E; background: #3D211C; }

  button.option.romantic-tint:hover,
  button.option.romantic-tint:active { border-color: #E8899E; background: #3D2530; }

  button.option.angry-tint:hover,
  button.option.angry-tint:active { border-color: #D64545; background: #3D1E1E; }

  button.option.nostalgic-tint:hover,
  button.option.nostalgic-tint:active { border-color: #9B87B0; background: #2E2638; }

  button.option.focused-tint:hover,
  button.option.focused-tint:active { border-color: #7FA98A; background: #223026; }

  .grid.moods {
    grid-template-columns: 1fr 1fr;
  }

  .grid.moods button.option {
    padding: 18px 14px;
  }

  .grid.moods button.option .emoji {
    font-size: 22px;
    margin-bottom: 6px;
  }

  .back {
    background: none;
    border: none;
    color: var(--text-muted);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    padding: 10px 0;
    margin-bottom: 18px;
    cursor: pointer;
    align-self: flex-start;
  }

  .mood-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border-radius: 100px;
    padding: 7px 14px 7px 10px;
    font-size: 14px;
    color: var(--text-muted);
    margin-bottom: 20px;
    width: fit-content;
  }

  .mood-pill .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
  }

  /* Reveal screen */
  #reveal {
    align-items: center;
    text-align: center;
  }

  .disc {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, var(--surface-raised), var(--ink) 70%);
    border: 3px solid var(--accent);
    margin: 0 auto 28px;
    position: relative;
    animation: spin 2.2s linear infinite;
  }

  .disc::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 14px; height: 14px;
    background: var(--ink);
    border: 2px solid var(--accent);
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  #reveal h1 {
    margin-bottom: 10px;
  }

  #reveal p {
    color: var(--text-muted);
    font-size: 15px;
    margin: 0;
  }

  .found-card {
    display: none;
    background: var(--surface);
    border: 1px solid #29293580;
    border-radius: 16px;
    padding: 24px;
    margin-top: 28px;
    width: 100%;
  }

  .found-card.show { display: block; animation: rise 0.4s ease both; }

  .found-card .label {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .found-card .track {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 500;
    margin: 0 0 4px;
  }

  .found-card .artist {
    color: var(--text-muted);
    font-size: 15px;
    margin: 0 0 20px;
  }

  .open-btn {
    display: block;
    width: 100%;
    text-align: center;
    background: var(--accent);
    color: #100C02;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 16px;
    padding: 16px;
    border-radius: 12px;
    text-decoration: none;
    border: none;
    cursor: pointer;
  }

  .again-btn {
    display: block;
    width: 100%;
    text-align: center;
    background: none;
    color: var(--text-muted);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    padding: 14px;
    border: none;
    cursor: pointer;
  }

  footer {
    text-align: center;
    font-size: 12px;
    color: #4A4A54;
    padding: 16px;
  }
</style>
</head>
<body>

<!-- STEP 1: MOOD -->
<div class="screen active" id="step-mood">
  <p class="kicker">Scan complete</p>
  <h1>What's the vibe right now?</h1>
  <div class="grid moods" id="mood-grid"></div>
</div>

<!-- STEP 2: GENRE -->
<div class="screen" id="step-genre">
  <button class="back" onclick="goTo('step-mood')">&larr; back</button>
  <div class="mood-pill"><span class="dot"></span><span id="mood-pill-label"></span></div>
  <h1>Pick a genre</h1>
  <div class="grid" id="genre-grid"></div>
</div>

<!-- STEP 3: REVEAL -->
<div class="screen" id="reveal">
  <div class="disc"></div>
  <h1 id="reveal-title">Digging through the crates&hellip;</h1>
  <p>One track, picked at random from the pool.</p>

  <div class="found-card" id="found-card">
    <p class="label">Now playing</p>
    <p class="track" id="found-track"></p>
    <p class="artist" id="found-artist"></p>
    <a class="open-btn" id="open-link" href="#" target="_blank" rel="noopener">Open on YouTube</a>
    <button class="again-btn" onclick="goTo('step-mood')">Start over</button>
  </div>
</div>

<footer>discovery pool &middot; 62 tracks &middot; growing</footer>

  const MOODS = [
    { id: "happy",     label: "Happy",     emoji: "\u2600\uFE0F", tint: "happy-tint",     color: "#F2B441", dim: "#4A3C1F" },

    { id: "romantic",  label: "Romantic",  emoji: "\uD83D\uDC9E", tint: "romantic-tint",  color: "#E8899E", dim: "#3D2530" },
    { id: "angry",     label: "Angry",     emoji: "\uD83D\uDCA2", tint: "angry-tint",     color: "#D64545", dim: "#3D1E1E" },
    { id: "nostalgic", label: "Nostalgic", emoji: "\uD83D\uDCFC", tint: "nostalgic-tint", color: "#9B87B0", dim: "#2E2638" },
    { id: "focused",   label: "Focused",   emoji: "\uD83C\uDFAF", tint: "focused-tint",   color: "#7FA98A", dim: "#223026" },
  ];

  const GENRES = [
    { id: "pop", label: "Pop", emoji: "\uD83C\uDFA4" },
    { id: "electronic", label: "Electronic", emoji: "\uD83C\uDFA7" },
    { id: "indie", label: "Indie", emoji: "\uD83C\uDFB8" },
  ];

  let chosenMood = null;

  function goTo(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function renderMoods() {
    const grid = document.getElementById('mood-grid');
    grid.innerHTML = '';
    MOODS.forEach(m => {
      const btn = document.createElement('button');
      btn.className = `option ${m.tint}`;
      btn.innerHTML = `<span class="emoji">${m.emoji}</span>${m.label}`;
      btn.onclick = () => selectMood(m);
      grid.appendChild(btn);
    });
  }

  function selectMood(mood) {
    chosenMood = mood;
    document.documentElement.style.setProperty('--accent', mood.color);
    document.documentElement.style.setProperty('--accent-dim', mood.dim);
    document.getElementById('mood-pill-label').textContent = mood.label;
    renderGenres();
    goTo('step-genre');
  }

  function renderGenres() {
    const grid = document.getElementById('genre-grid');
    grid.innerHTML = '';
    GENRES.forEach(g => {
      const btn = document.createElement('button');
      btn.className = `option ${chosenMood.tint}`;
      btn.innerHTML = `<span class="emoji">${g.emoji}</span>${g.label}`;
      btn.onclick = () => selectGenre(g);
      grid.appendChild(btn);
    });
  }

  function selectGenre(genre) {
    // Try exact mood + genre match first.
    let pool = SONGS.filter(s => s.mood.includes(chosenMood.id) && s.genre.includes(genre.id));
    // Fallback: widen to mood-only if the exact combo is thin.
    if (pool.length === 0) {
      pool = SONGS.filter(s => s.mood.includes(chosenMood.id));
    }
    const pick = pool[Math.floor(Math.random() * pool.length)];

    goTo('reveal');
    document.getElementById('found-card').classList.remove('show');
    document.getElementById('reveal-title').textContent = "Digging through the crates\u2026";

    setTimeout(() => {
      document.getElementById('reveal-title').textContent = "Found one";
      document.getElementById('found-track').textContent = pick.title;
      document.getElementById('found-artist').textContent = pick.artist;
      document.getElementById('open-link').href = pick.url;
      document.getElementById('found-card').classList.add('show');
    }, 1100);
  }

  renderMoods();
</script>

</body>
</html>
